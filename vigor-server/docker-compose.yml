version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vigor-postgres
    environment:
      POSTGRES_USER: vigor
      POSTGRES_PASSWORD: vigor_password
      POSTGRES_DB: vigor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vigor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: vigor-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vigor:vigor_password@postgres:5432/vigor_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-crawler:
    build: .
    container_name: vigor-celery-crawler
    command: celery -A app.celery_app worker -Q crawler --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://vigor:vigor_password@postgres:5432/vigor_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-processor:
    build: .
    container_name: vigor-celery-processor
    command: celery -A app.celery_app worker -Q processor --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://vigor:vigor_password@postgres:5432/vigor_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-updater:
    build: .
    container_name: vigor-celery-updater
    command: celery -A app.celery_app worker -Q updater --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://vigor:vigor_password@postgres:5432/vigor_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: vigor-celery-beat
    command: celery -A app.celery_app beat
    environment:
      DATABASE_URL: postgresql+asyncpg://vigor:vigor_password@postgres:5432/vigor_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: vigor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: vigor-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
